
<div class="container">
      <h2>Login</h2>
      @if (errorMsg) {
            <p class="error">{{ errorMsg }}</p>
      }
      <form [formGroup]="loginForm" class="login-form" (ngSubmit)="onSubmit()">
            <label class="email-label">
                  Email:
                  <input formControlName="email" class="email-input" />
                  @if (loginForm.controls.email.touched && loginForm.controls.email.dirty) {
                        <ng-container>
                              @if (loginForm.controls.email.errors?.['required']) {
                                    <p class="error">Field is required</p>
                              }
                              @if (loginForm.controls.email.errors?.['email']) {
                                    <p class="error">Invalid email format</p>
                              }      
                        </ng-container>
                         
                  }
            </label>
            <br />
            <label class="password-label">
                  Password:
                  <input type="password" formControlName="password" class="password-input"/>
                  @if (loginForm.controls.password.touched && loginForm.controls.password.dirty) {
                        <ng-container>
                              @if (loginForm.controls.password.errors?.['required']) {
                                    <p class="error">Field is required</p>
                              }
                              @if (loginForm.controls.password.errors?.['minlength']) {
                                    <p class="error">Minimum length is 6 characters</p>
                              }      
                        </ng-container>
                         
                  }
            </label>
            <br />
            <button type="submit" [disabled]="loginForm.invalid" class="submit-btn">Login</button>
      </form>

</div>
